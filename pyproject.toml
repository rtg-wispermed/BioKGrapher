[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biokgrapher"
version = "1.0.0"
description = "Automated knowledge-graph construction from PubMed via MedCAT (Schäfer et al., CSBJ 2024)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RTG WisPerMed / BioKGrapher contributors" }]
dependencies = [
    "lxml>=5",
    "httpx>=0.27",
    "tqdm>=4.66",
    "typer>=0.12",
    "tomli>=2 ; python_version < '3.11'",
]

[project.optional-dependencies]
annotate = ["medcat[meta-cat]>=2"]
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
biokgrapher = "biokgrapher.cli:app"

[project.urls]
Paper = "https://doi.org/10.1016/j.csbj.2024.10.017"

[tool.setuptools]
packages = ["biokgrapher", "biokgrapher.web"]

[tool.setuptools.package-data]
"biokgrapher.web" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
